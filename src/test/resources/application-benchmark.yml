# Yusi Benchmark profile：与 dev 叠加使用（@ActiveProfiles({"dev", "benchmark"})）。
# 仅覆盖需要偏离 dev 的键：数据源、Milvus 隔离集合、以及为缺少本机环境变量时提供的兜底值。
# 真实模型凭据仍通过 CHAT_MODEL_* / EMBEDDING_MODEL_* 环境变量注入（无则运行期诚实失败并写入记分卡）。

spring:
  datasource:
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    url: ${YUSI_BENCHMARK_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/yusi?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=UTC&useSSL=true}
  jpa:
    show-sql: false

# 覆盖 dev 的 gRPC server 固定 9090：benchmark 随机端口，避免与本地服务/残留 JVM 冲突
grpc:
  server:
    port: 0

milvus:
  uri: ${MILVUS_URI:http://127.0.0.1:19530}
  token: ${MILVUS_TOKEN:}
  host: ${MILVUS_HOST:127.0.0.1}
  port: ${MILVUS_PORT:19530}
  username: ${MILVUS_USERNAME:}
  password: ${MILVUS_PASSWORD:}

yusi:
  benchmark:
    scorecard:
      # 统一记分卡 overallScore 权重（可配置，不写死）；
      # 与五个 layer 的 aggregateScores 键一致，缺失/不归一/覆盖不全时拒绝合成总分并注明原因
      weights:
        retrieval: 0.25
        extraction: 0.20
        chat: 0.25
        match: 0.15
        e2e: 0.15
  milvus:
    collections:
      # benchmark 专用隔离集合，跑完由 BenchmarkDataGuard drop
      embedding: ${YUSI_BENCHMARK_MILVUS_EMBEDDING_COLLECTION:yusi_benchmark_embedding_collection}
      mid-term-memory: ${YUSI_BENCHMARK_MILVUS_MID_TERM_COLLECTION:yusi_benchmark_mid_term_memory}
      match-profile: ${YUSI_BENCHMARK_MILVUS_MATCH_PROFILE_COLLECTION:yusi_benchmark_match_profile}
  jwt:
    secret: ${YUSI_JWT_SECRET:benchmark-only-yusi-jwt-secret-32-bytes-long}
  security:
    crypto:
      server-aes-key-base64: ${YUSI_ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      backup-rsa-public-key-spki-base64: ${YUSI_BACKUP_RSA_PUBLIC_KEY_SPKI_BASE64:}
      backup-rsa-private-key-pkcs8-base64: ${YUSI_BACKUP_RSA_PRIVATE_KEY_PKCS8_BASE64:}
  oss:
    domain: ${YUSI_OSS_DOMAIN:}
    region: ${YUSI_OSS_REGION:cn-hangzhou}
    bucket-name: ${YUSI_OSS_BUCKET_NAME:}
    endpoint: ${YUSI_OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
    access-key-id: ${YUSI_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${YUSI_OSS_ACCESS_KEY_SECRET:}

amap:
  key: ${AMAP_API_KEY:}
