spring:
  config:
    name: yusi
  profiles:
    active: prod

yusi:
  milvus:
    collections:
      # 集合名默认与历史硬编码一致；benchmark 等隔离场景可覆盖为独立前缀
      embedding: yusi_embedding_collection
      mid-term-memory: yusi_mid_term_memory
      match-profile: yusi_match_profile
  web:
    trusted-proxy-addresses: ${YUSI_TRUSTED_PROXY_ADDRESSES:}
  rate-limit:
    hmac-secret: ${YUSI_RATE_LIMIT_HMAC_SECRET:}
  memory:
    # 上下文记忆窗口大小（短期记忆的消息条数）
    context-window-size: 20
    # 动态 System Message 的 token 预算
    context-token-budget: ${YUSI_CONTEXT_TOKEN_BUDGET:4096}
    # 中期记忆总结间隔（毫秒，默认 1 小时）
    mid-term-summary-interval: 7200000
    # 中期记忆触发扫描的 Cron 表达式（默认每 30 分钟执行一次）
    mid-term-scan-cron: "0 */10 * * * ?"
    # 半衰期衰减与遗忘：软衰减替代硬过期，命中强化巩固记忆
    decay:
      # 半衰期（天）：有效重要性每过 N 天减半
      half-life-days: 14
      # 衰减后有效重要性低于该值即视为完全遗忘
      forgotten-threshold: 0.1
      # 初始重要性低于该值的记忆才可能被完全遗忘
      initial-importance-gate: 0.5
      # 检索命中强化系数：new = old + (1 - old) * factor
      reinforce-factor: 0.2
  oss:
    domain: ${OSS_DOMAIN:}
    region: ${OSS_REGION:cn-hangzhou}
    bucket-name: ${OSS_BUCKET_NAME:}
    endpoint: ${OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
    url-expire-seconds: ${OSS_URL_EXPIRE_SECONDS:3600}
    max-file-size: ${OSS_MAX_FILE_SIZE:52428800}
    image-folder: ${OSS_IMAGE_FOLDER:yusi/images/}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
  alert:
    feishu:
      enabled: ${YUSI_ALERT_FEISHU_ENABLED:false}
      interval-ms: ${YUSI_ALERT_FEISHU_INTERVAL_MS:30000}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis,milvus,modelGateway,tasks
