grpc:
  server:
    port: 9090

server:
  port: 20611
  tomcat:
    threads:
      max: 200 # 设定处理客户请求的线程的最大数目，决定了服务器可以同时响应客户请求的数,默认200
      min-spare: 50 # 初始化线程数,最小空闲线程数,默认是10
    accept-count: 10 # 等待队列长度

model:
  gateway:
    admission:
      enabled: ${LLM_ADMISSION_ENABLED:true}
      window-seconds: ${LLM_ADMISSION_WINDOW_SECONDS:60}
      reservation-ttl-seconds: ${LLM_ADMISSION_RESERVATION_TTL_SECONDS:300}
      user:
        max-requests: ${LLM_USER_MAX_REQUESTS:60}
        max-tokens: ${LLM_USER_MAX_TOKENS:200000}
      model:
        max-requests: ${LLM_MODEL_MAX_REQUESTS:600}
        max-tokens: ${LLM_MODEL_MAX_TOKENS:2000000}
      provider:
        max-requests: ${LLM_PROVIDER_MAX_REQUESTS:1000}
        max-tokens: ${LLM_PROVIDER_MAX_TOKENS:4000000}
  embedding:
    baseurl: ${EMBEDDING_MODEL_BASEURL}
    apikey: ${EMBEDDING_MODEL_APIKEY}
    model: ${EMBEDDING_MODEL_NAME}
    dimension: ${EMBEDDING_MODEL_DIMENSION:1024}
  routing:
    version: 0
    schema-version: 2
    default-scene: chat
    default-tier: chat-primary
    default-route:
      id: default
      scene: '*'
      primary-tier: chat-primary
      priority: 0
    state-channel: yusi:model:state:channel
    instance-state-map-key: yusi:model:state:instances
    failure-threshold: 3
    recovery-success-threshold: 2
    recovery-probe-interval-ms: 15000
    models:
      - id: qwen-main
        provider: openai-compatible
        protocol: RESPONSES
        baseurl: ${CHAT_MODEL_BASEURL}
        apikey: ${CHAT_MODEL_APIKEY}
        model: ${CHAT_MODEL_NAME}
        thinking-enabled: false
        max-output-tokens: 8192
        capabilities: [CHAT, STREAMING_CHAT, VLM]
        weight: 100
        priority: 1
        scenes: [chat, logic, graphrag-extract, graphrag-merge-suggest, memory-extract, soul-match, soul-match-letter, emotion-analysis, cognition-routing, soul-weekly-report, cognitive-conflict, memory-fusion, agent-persona, agent-proactive-greeting, image-understanding]
      - id: dashscope-asr
        enabled: ${DASHSCOPE_ASR_ENABLED:false}
        provider: dashscope
        baseurl: ${DASHSCOPE_ASR_BASEURL:wss://dashscope.aliyuncs.com/api-ws/v1/inference}
        apikey: ${DASHSCOPE_API_KEY:}
        model: ${DASHSCOPE_ASR_MODEL:qwen-audio-3.0-asr-flash-streaming}
        timeout-seconds: 120
        capabilities: [STREAMING_SPEECH_TO_TEXT]
    tiers:
      chat-primary:
        display-name: Chat primary
        description: General chat and multimodal traffic
        strategy: ROUND_ROBIN
        members: [qwen-main]
        capabilities: [CHAT, STREAMING_CHAT]
      vision:
        display-name: Vision language models
        description: Image understanding and visual cognition
        strategy: FAIL_OVER
        members: [qwen-main]
        capabilities: [VLM]
      logic:
        display-name: Logic analysis
        description: Situation room analysis
        strategy: LEAST_LATENCY
        members: [qwen-main]
        capabilities: [CHAT, STREAMING_CHAT]
      graph:
        display-name: GraphRAG
        description: Entity extraction and merge suggestions
        strategy: FAIL_OVER
        members: [qwen-main]
        capabilities: [CHAT, STREAMING_CHAT]
      memory:
        display-name: Memory
        description: Memory extraction and fusion
        strategy: FAIL_OVER
        members: [qwen-main]
        capabilities: [CHAT, STREAMING_CHAT]
      emotion:
        display-name: Emotion analysis
        description: Emotion extraction and classification
        strategy: LEAST_LATENCY
        members: [qwen-main]
        capabilities: [CHAT, STREAMING_CHAT]
      match:
        display-name: Soul match
        description: Match ranking and recommendation letters
        strategy: FAIL_OVER
        members: [qwen-main]
        capabilities: [CHAT, STREAMING_CHAT]
      cognition:
        display-name: Cognition
        description: Cognition routing and conflict detection
        strategy: FAIL_OVER
        members: [qwen-main]
        capabilities: [CHAT, STREAMING_CHAT]
      report:
        display-name: Reports
        description: Weekly soul reports
        strategy: LEAST_LATENCY
        members: [qwen-main]
        capabilities: [CHAT, STREAMING_CHAT]
      agent:
        display-name: Agent proactive
        description: Proactive agent greetings
        strategy: LEAST_LATENCY
        members: [qwen-main]
        capabilities: [CHAT, STREAMING_CHAT]
      asr-default:
        display-name: Streaming speech recognition
        description: Duplex PCM speech input
        strategy: FAIL_OVER
        members: [dashscope-asr]
        capabilities: [STREAMING_SPEECH_TO_TEXT]
    routes:
      - id: chat
        scene: chat
        risk-level: LOW
        primary-tier: chat-primary
        max-input-tokens: ${LLM_CHAT_MAX_INPUT_TOKENS:12000}
        max-output-tokens: ${LLM_CHAT_MAX_OUTPUT_TOKENS:1024}
        priority: 100
      - id: logic
        scene: logic
        risk-level: LOW
        primary-tier: logic
        priority: 100
      - id: graphrag-extract
        scene: graphrag-extract
        risk-level: LOW
        primary-tier: graph
        max-output-tokens: ${LLM_GRAPH_MAX_OUTPUT_TOKENS:8192}
        priority: 100
      - id: graphrag-merge-suggest
        scene: graphrag-merge-suggest
        risk-level: LOW
        primary-tier: graph
        max-output-tokens: ${LLM_GRAPH_MAX_OUTPUT_TOKENS:8192}
        priority: 100
      - id: memory-extract
        scene: memory-extract
        risk-level: LOW
        primary-tier: memory
        priority: 100
      - id: memory-fusion
        scene: memory-fusion
        risk-level: LOW
        primary-tier: memory
        priority: 100
      - id: soul-match
        scene: soul-match
        risk-level: MEDIUM
        primary-tier: match
        priority: 100
      - id: soul-match-letter
        scene: soul-match-letter
        risk-level: MEDIUM
        primary-tier: match
        priority: 100
      - id: emotion-analysis
        scene: emotion-analysis
        risk-level: LOW
        primary-tier: emotion
        max-output-tokens: 32
        temperature: 0.3
        priority: 100
      - id: cognition-routing
        scene: cognition-routing
        risk-level: LOW
        primary-tier: cognition
        priority: 100
      - id: cognitive-conflict
        scene: cognitive-conflict
        risk-level: LOW
        primary-tier: cognition
        priority: 100
      - id: soul-weekly-report
        scene: soul-weekly-report
        risk-level: LOW
        primary-tier: report
        priority: 100
      - id: agent-persona
        scene: agent-persona
        risk-level: LOW
        primary-tier: chat-primary
        priority: 100
      - id: agent-proactive-greeting
        scene: agent-proactive-greeting
        risk-level: LOW
        primary-tier: agent
        priority: 100
      - id: image-understanding
        scene: image-understanding
        risk-level: LOW
        primary-tier: vision
        priority: 100
yusi:
  alert:
    feishu:
      enabled: ${YUSI_ALERT_FEISHU_ENABLED:false}
      interval-ms: ${YUSI_ALERT_FEISHU_INTERVAL_MS:30000}
  web:
    allowed-origin: ${YUSI_WEB_ALLOWED_ORIGIN:http://localhost:5173}
    trusted-proxy-addresses: ${YUSI_TRUSTED_PROXY_ADDRESSES:}
    dev-mode-enabled: ${YUSI_WEB_DEV_MODE_ENABLED:false}
    policy-refresh-ms: ${YUSI_WEB_POLICY_REFRESH_MS:5000}
  diary:
    voice:
      max-duration-seconds: ${YUSI_VOICE_MAX_DURATION_SECONDS:120}
      handshake-timeout-seconds: ${YUSI_VOICE_HANDSHAKE_TIMEOUT_SECONDS:10}
      idle-timeout-seconds: ${YUSI_VOICE_IDLE_TIMEOUT_SECONDS:20}
      max-frame-bytes: ${YUSI_VOICE_MAX_FRAME_BYTES:65536}
      max-audio-bytes: ${YUSI_VOICE_MAX_AUDIO_BYTES:3840000}
      send-time-limit-millis: ${YUSI_VOICE_SEND_TIME_LIMIT_MILLIS:10000}
      send-buffer-size-bytes: ${YUSI_VOICE_SEND_BUFFER_SIZE_BYTES:524288}
  jwt:
    secret: ${YUSI_JWT_SECRET}
  security:
    crypto:
      server-aes-key-base64: ${YUSI_ENCRYPTION_KEY}
      backup-rsa-public-key-spki-base64: ${YUSI_BACKUP_RSA_PUBLIC_KEY_SPKI_BASE64}
      backup-rsa-private-key-pkcs8-base64: ${YUSI_BACKUP_RSA_PRIVATE_KEY_PKCS8_BASE64}
  memory:
    # 上下文记忆窗口大小（短期记忆的消息条数）
    context-window-size: 20
    # 动态 System Message 的 token 预算
    context-token-budget: ${YUSI_CONTEXT_TOKEN_BUDGET:4096}
    # 中期记忆总结间隔（毫秒，默认 1 小时）
    mid-term-summary-interval: 3600000
    # 中期记忆触发扫描的 Cron 表达式（默认每 30 分钟执行一次）
    mid-term-scan-cron: "0 */30 * * * ?"
  oss:
    domain: ${YUSI_OSS_DOMAIN}
    region: ${YUSI_OSS_REGION}
    bucket-name: ${YUSI_OSS_BUCKET_NAME}
    endpoint: ${YUSI_OSS_ENDPOINT}
    url-expire-seconds: ${YUSI_OSS_URL_EXPIRE_SECONDS:3600}
    max-file-size: ${YUSI_OSS_MAX_FILE_SIZE:10485760}
    image-folder: ${YUSI_OSS_IMAGE_FOLDER:yusi/images/}
    access-key-id: ${YUSI_OSS_ACCESS_KEY_ID}
    access-key-secret: ${YUSI_OSS_ACCESS_KEY_SECRET}

# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-seconds: 60
        block-queue-size: 5000
        policy: CallerRunsPolicy

# 数据库配置；启动时配置数据库资源信息
spring:
  datasource:
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD}
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/yusi?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=UTC&useSSL=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: Retail_HikariCP
      minimum-idle: 5 #最小空闲连接数量
      idle-timeout: 60000 #空闲连接存活最大时间，默认600000（10分钟）
      maximum-pool-size: 10 #连接池最大连接数，默认是10
      auto-commit: true #此属性控制从池返回的连接的默认自动提交行为,默认值：true
      max-lifetime: 120000 #此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认1800000即30分钟
      connection-timeout: 30000 #数据库连接超时时间,默认30秒，即30000
      connection-test-query: SELECT 1
    type: com.zaxxer.hikari.HikariDataSource
  servlet:
    multipart:
      max-file-size: 15MB #上传文件单个大小限制
      max-request-size: 60MB #上传文件总大小限制
      enabled: true #是否开启文件上传功能，默认false
  jpa:
    show-sql: true #是否打印SQL语句，默认false
    hibernate:
      ddl-auto: none #自动更新数据库表结构，默认none，可选值none、create、create-drop、validate、update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy #数据库表和字段的命名策略，默认org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect #数据库方言，默认org.hibernate.dialect.MySQL5Dialect

#Redis 配置
redis:
  sdk:
    config:
      host: 127.0.0.1
      port: 6379
      password: ${REDIS_SDK_CONFIG_PASSWORD:}
      pool-size: 10
      min-idle-size: 5
      idle-timeout: 30000
      connect-timeout: 5000
      retry-attempts: 3
      retry-interval: 1000
      ping-interval: 60000
      keep-alive: true

milvus:
  uri: ${MILVUS_URI}
  token: ${MILVUS_TOKEN}
  host: ${MILVUS_HOST}
  port: ${MILVUS_PORT}
  username: ${MILVUS_USERNAME}
  password: ${MILVUS_PASSWORD}

# 日志
logging:
  level:
    root: info
  config: classpath:logback-spring.xml

# MCP (Model Context Protocol) 配置
# 启用后，DiaryAssistant 将可以使用 MCP Server 提供的工具（如 web_search）
mcp:
  enabled: false # 设置为 true 启用 MCP 集成
  server:
    url: http://localhost:11611/internal/mcp # Go MCP 内部端点 (仅部署工具)
    service-key: ${MCP_AUTH_API_KEY:}

# 高德地图 API 配置
amap:
  key: ${AMAP_API_KEY}
  base-url: https://restapi.amap.com/v3

# 阿里云邮件推送服务
aliyun:
  dm:
    accessKeyId: ${ALIYUN_DM_ACCESS_KEY_ID:}
    accessKeySecret: ${ALIYUN_DM_ACCESS_KEY_SECRET:}
    accountName: ${ALIYUN_DM_ACCOUNT_NAME:}
    fromAlias: ${ALIYUN_DM_FROM_ALIAS:Yusi}
    endpoint: dm.aliyuncs.com
