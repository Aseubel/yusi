grpc:
  server:
    port: 9090

server:
  port: 611

  tomcat:
    threads:
      max: 200 # 设定处理客户请求的线程的最大数目，决定了服务器可以同时响应客户请求的数,默认200
      min-spare: 20 # 初始化线程数,最小空闲线程数,默认是10
    accept-count: 100 # 等待队列长度
    max-connections: 500 # 最大连接数

model:
  gateway:
    admission:
      enabled: ${LLM_ADMISSION_ENABLED:true}
      window-seconds: ${LLM_ADMISSION_WINDOW_SECONDS:60}
      reservation-ttl-seconds: ${LLM_ADMISSION_RESERVATION_TTL_SECONDS:300}
      user:
        max-requests: ${LLM_USER_MAX_REQUESTS:60}
        max-tokens: ${LLM_USER_MAX_TOKENS:200000}
      model:
        max-requests: ${LLM_MODEL_MAX_REQUESTS:600}
        max-tokens: ${LLM_MODEL_MAX_TOKENS:2000000}
      provider:
        max-requests: ${LLM_PROVIDER_MAX_REQUESTS:1000}
        max-tokens: ${LLM_PROVIDER_MAX_TOKENS:4000000}
  embedding:
    baseurl: ${EMBEDDING_MODEL_BASEURL:https://api.siliconflow.cn/v1}
    apikey: ${EMBEDDING_MODEL_APIKEY}
    model: ${EMBEDDING_MODEL_NAME:BAAI/bge-m3}
    dimension: ${EMBEDDING_MODEL_DIMENSION:1024}
  routing:
    version: 0
    schema-version: 2
    default-scene: chat
    default-tier: chat-primary
    default-route:
      id: default
      scene: '*'
      primary-tier: chat-primary
      priority: 0
    state-channel: yusi:model:state:channel
    instance-state-map-key: yusi:model:state:instances
    failure-threshold: 3
    recovery-success-threshold: 2
    recovery-probe-interval-ms: 15000
    models:
      - id: qwen
        provider: dashscope
        protocol: CHAT_COMPLETIONS
        baseurl: ${QWEN_BASEURL:https://dashscope.aliyuncs.com/compatible-mode/v1}
        apikey: ${QWEN_APIKEY}
        model: ${QWEN_MODEL:qwen3.5-flash-2026-02-23}
        capabilities: [CHAT, STREAMING_CHAT]
        weight: 100
        priority: 2
        scenes: [chat, logic, graphrag-extract, graphrag-merge-suggest, memory-extract, soul-match, soul-match-letter, emotion-analysis, cognition-routing, soul-weekly-report, cognitive-conflict, memory-fusion, agent-persona, agent-proactive-greeting, image-understanding]
      - id: deepseek
        provider: deepseek
        protocol: CHAT_COMPLETIONS
        baseurl: ${DEEPSEEK_BASEURL:https://api.deepseek.com}
        apikey: ${DEEPSEEK_APIKEY}
        model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
        capabilities: [CHAT, STREAMING_CHAT]
        weight: 0
        priority: 1
        scenes: [chat, logic, graphrag-extract, graphrag-merge-suggest, memory-extract, soul-match, soul-match-letter, emotion-analysis, cognition-routing, soul-weekly-report, cognitive-conflict, memory-fusion, agent-persona, agent-proactive-greeting, image-understanding]
      - id: whisper-asr
        enabled: ${ASR_ENABLED:false}
        provider: openai
        baseurl: ${ASR_BASE_URL:https://api.openai.com/v1/audio/transcriptions}
        apikey: ${ASR_API_KEY:}
        model: ${ASR_MODEL:whisper-1}
        timeout-seconds: 120
        capabilities: [SPEECH_TO_TEXT]
      - id: dashscope-asr
        enabled: ${DASHSCOPE_ASR_ENABLED:false}
        provider: dashscope
        baseurl: ${DASHSCOPE_ASR_BASEURL:https://dashscope.aliyuncs.com/api/v1}
        apikey: ${DASHSCOPE_API_KEY:}
        model: ${DASHSCOPE_ASR_MODEL:paraformer-realtime-v2}
        timeout-seconds: 120
        capabilities: [SPEECH_TO_TEXT]
    tiers:
      chat-primary:
        display-name: Chat primary
        description: General chat and multimodal traffic
        strategy: FAIL_OVER
        members: [qwen, deepseek]
        capabilities: [CHAT, STREAMING_CHAT]
      logic:
        display-name: Logic analysis
        description: Situation room analysis
        strategy: FAIL_OVER
        members: [qwen, deepseek]
        capabilities: [CHAT, STREAMING_CHAT]
      graph:
        display-name: GraphRAG
        description: Entity extraction and merge suggestions
        strategy: FAIL_OVER
        members: [qwen, deepseek]
        capabilities: [CHAT, STREAMING_CHAT]
      memory:
        display-name: Memory
        description: Memory extraction and fusion
        strategy: FAIL_OVER
        members: [qwen, deepseek]
        capabilities: [CHAT, STREAMING_CHAT]
      emotion:
        display-name: Emotion analysis
        description: Emotion extraction and classification
        strategy: WEIGHTED_RANDOM
        members: [qwen, deepseek]
        capabilities: [CHAT, STREAMING_CHAT]
      match:
        display-name: Soul match
        description: Match ranking and recommendation letters
        strategy: FAIL_OVER
        members: [qwen, deepseek]
        capabilities: [CHAT, STREAMING_CHAT]
      cognition:
        display-name: Cognition
        description: Cognition routing and conflict detection
        strategy: FAIL_OVER
        members: [qwen, deepseek]
        capabilities: [CHAT, STREAMING_CHAT]
      report:
        display-name: Reports
        description: Weekly soul reports
        strategy: LEAST_LATENCY
        members: [qwen, deepseek]
        capabilities: [CHAT, STREAMING_CHAT]
      agent:
        display-name: Agent proactive
        description: Proactive agent greetings
        strategy: LEAST_LATENCY
        members: [qwen, deepseek]
        capabilities: [CHAT, STREAMING_CHAT]
      asr-default:
        display-name: Speech recognition
        description: OpenAI-compatible speech-to-text fallbacks
        strategy: FAIL_OVER
        members: [whisper-asr, dashscope-asr]
        capabilities: [SPEECH_TO_TEXT]
    routes:
      - id: chat
        scene: chat
        risk-level: LOW
        primary-tier: chat-primary
        priority: 100
      - id: logic
        scene: logic
        risk-level: LOW
        primary-tier: logic
        max-output-tokens: 256
        temperature: 0.1
        priority: 100
      - id: graphrag-extract
        scene: graphrag-extract
        risk-level: LOW
        primary-tier: graph
        priority: 100
      - id: graphrag-merge-suggest
        scene: graphrag-merge-suggest
        risk-level: LOW
        primary-tier: graph
        priority: 100
      - id: memory-extract
        scene: memory-extract
        risk-level: LOW
        primary-tier: memory
        priority: 100
      - id: memory-fusion
        scene: memory-fusion
        risk-level: LOW
        primary-tier: memory
        priority: 100
      - id: soul-match
        scene: soul-match
        risk-level: MEDIUM
        primary-tier: match
        priority: 100
      - id: soul-match-letter
        scene: soul-match-letter
        risk-level: MEDIUM
        primary-tier: match
        priority: 100
      - id: emotion-analysis
        scene: emotion-analysis
        risk-level: LOW
        primary-tier: emotion
        max-output-tokens: 32
        temperature: 0.3
        priority: 100
      - id: cognition-routing
        scene: cognition-routing
        risk-level: LOW
        primary-tier: cognition
        priority: 100
      - id: cognitive-conflict
        scene: cognitive-conflict
        risk-level: LOW
        primary-tier: cognition
        priority: 100
      - id: soul-weekly-report
        scene: soul-weekly-report
        risk-level: LOW
        primary-tier: report
        priority: 100
      - id: agent-persona
        scene: agent-persona
        risk-level: LOW
        primary-tier: chat-primary
        priority: 100
      - id: agent-proactive-greeting
        scene: agent-proactive-greeting
        risk-level: LOW
        primary-tier: agent
        priority: 100
      - id: image-understanding
        scene: image-understanding
        risk-level: MEDIUM
        primary-tier: chat-primary
        priority: 100
yusi:
  web:
    allowed-origin: ${YUSI_WEB_ALLOWED_ORIGIN:https://app.aseubel.cn}
    trusted-proxy-addresses: ${YUSI_TRUSTED_PROXY_ADDRESSES:}
  jwt:
    secret: ${YUSI_JWT_SECRET}
  security:
    crypto:
      server-aes-key-base64: ${YUSI_ENCRYPTION_KEY}
      backup-rsa-public-key-spki-base64: ${YUSI_BACKUP_RSA_PUBLIC_KEY_SPKI_BASE64}
      backup-rsa-private-key-pkcs8-base64: ${YUSI_BACKUP_RSA_PRIVATE_KEY_PKCS8_BASE64}
  memory:
    # 上下文记忆窗口大小（短期记忆的消息条数）
    context-window-size: 20
    # 中期记忆总结间隔（毫秒，默认 1 小时）
    mid-term-summary-interval: 7200000
    # 中期记忆触发扫描的 Cron 表达式（默认每 30 分钟执行一次）
    mid-term-scan-cron: "0 */10 * * * ?"
  oss:
    domain: ${OSS_DOMAIN:oss.aseubel.cn}
    region: ${OSS_REGION:cn-guangzhou}
    bucket-name: ${OSS_BUCKET_NAME:yangaseubel}
    endpoint: ${OSS_ENDPOINT:oss-cn-guangzhou.aliyuncs.com}
    url-expire-seconds: 3600
    max-file-size: 10485760
    image-folder: yusi/images/
    access-key-id: ${OSS_ACCESS_KEY_ID}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET}


# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 200
        keep-alive-seconds: 60
        block-queue-size: 500
        policy: CallerRunsPolicy

# 数据库配置；启动时配置数据库资源信息
spring:
  datasource:
    # ShardingSphere 对 Driver 自定义，实现分库分表等隐藏逻辑
    #    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    # ShardingSphere 配置文件路径
    #    url: jdbc:shardingsphere:classpath:shardingsphere-config.yaml
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD}
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/yusi?serverTimezone=UTC&characterEncoding=utf8&autoReconnect=true&serverTimezone=Asia/Shanghai}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: Retail_HikariCP
      minimum-idle: 10
      idle-timeout: 600000
      maximum-pool-size: 20
      auto-commit: true
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
    type: com.zaxxer.hikari.HikariDataSource
  servlet:
    multipart:
      max-file-size: 15MB #上传文件单个大小限制
      max-request-size: 60MB #上传文件总大小限制
      enabled: true #是否开启文件上传功能，默认false
  jpa:
    show-sql: false #是否打印SQL语句，默认false
    hibernate:
      ddl-auto: none #自动更新数据库表结构，默认none，可选值none、create、create-drop、validate、update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy #数据库表和字段的命名策略，默认org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect #数据库方言，默认org.hibernate.dialect.MySQL5Dialect

#Redis 配置
redis:
  sdk:
    config:
      host: ${REDIS_SDK_CONFIG_HOST:redis}
      port: ${REDIS_SDK_CONFIG_PORT:6379}
      password: ${REDIS_SDK_CONFIG_PASSWORD}
      pool-size: 10
      min-idle-size: 5
      idle-timeout: 30000
      connect-timeout: 5000
      retry-attempts: 3
      retry-interval: 1000
      ping-interval: 60000
      keep-alive: true

milvus:
  uri: ${MILVUS_URI}
  token: ${MILVUS_TOKEN}
  host: ${MILVUS_HOST:}
  port: ${MILVUS_PORT:19530}
  username: ${MILVUS_USERNAME}
  password: ${MILVUS_PASSWORD}

# 日志
logging:
  level:
    root: info
  config: classpath:logback-spring.xml

# MCP (Model Context Protocol) 配置
# 启用后，DiaryAssistant 将可以使用 MCP Server 提供的工具（如 web_search）
mcp:
  enabled: ${MCP_ENABLED:true} # Set false to disable the internal MCP client.
  server:
    url: http://yusi-mcp:11611/internal/mcp # Go MCP 内部端点 (仅部署工具)
    service-key: ${MCP_AUTH_API_KEY}

# 高德地图 API 配置
amap:
  key: ${AMAP_KEY}
  base-url: https://restapi.amap.com/v3

# 阿里云邮件推送服务
aliyun:
  dm:
    accessKeyId: ${ALIYUN_DM_ACCESS_KEY_ID}
    accessKeySecret: ${ALIYUN_DM_ACCESS_KEY_SECRET}
    accountName: ${ALIYUN_DM_ACCOUNT_NAME:yusi@mail.aseubel.cn}
    fromAlias: Yusi
    endpoint: dm.aliyuncs.com
