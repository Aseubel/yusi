grpc:
  server:
    port: 9090

server:
  port: 611

  tomcat:
    threads:
      max: 200 # 设定处理客户请求的线程的最大数目，决定了服务器可以同时响应客户请求的数,默认200
      min-spare: 20 # 初始化线程数,最小空闲线程数,默认是10
    accept-count: 100 # 等待队列长度
    max-connections: 500 # 最大连接数

model:
  embedding:
    baseurl: ${EMBEDDING_MODEL_BASEURL:https://api.siliconflow.cn/v1}
    apikey: ${EMBEDDING_MODEL_APIKEY}
    model: ${EMBEDDING_MODEL_NAME:BAAI/bge-m3}
    dimension: ${EMBEDDING_MODEL_DIMENSION:1024}
  routing:
    version: 0
    schema-version: 2
    default-language: zh
    default-scene: chat
    default-tier: chat-zh
    default-route:
      id: default
      language: '*'
      scene: chat
      primary-tier: chat-zh
      priority: 0
    strategy-channel: yusi:model:group:strategy:channel
    state-channel: yusi:model:state:channel
    instance-state-map-key: yusi:model:state:instances
    group-strategy-map-key: yusi:model:group:strategies
    failure-threshold: 3
    recovery-success-threshold: 2
    recovery-probe-interval-ms: 15000
    capability-groups:
      SPEECH_TO_TEXT: asr-default
    models:
      - id: qwen
        baseurl: ${QWEN_BASEURL:https://dashscope.aliyuncs.com/compatible-mode/v1}
        apikey: ${QWEN_APIKEY}
        model: ${QWEN_MODEL:qwen3.5-flash-2026-02-23}
        capabilities: [CHAT, STREAMING_CHAT]
        weight: 100
        priority: 2
        languages: [zh, en]
        scenes: [chat, situation-analysis, memory-extract, emotion-analysis, soul-match]
      - id: deepseek
        baseurl: ${DEEPSEEK_BASEURL:https://api.deepseek.com}
        apikey: ${DEEPSEEK_APIKEY}
        model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
        capabilities: [CHAT, STREAMING_CHAT]
        weight: 0
        priority: 1
        languages: [zh, en]
        scenes: [chat, situation-analysis, memory-extract, emotion-analysis, soul-match]
      - id: whisper-asr
        enabled: ${ASR_ENABLED:false}
        provider: openai
        baseurl: ${ASR_BASE_URL:https://api.openai.com/v1/audio/transcriptions}
        apikey: ${ASR_API_KEY:}
        model: ${ASR_MODEL:whisper-1}
        timeout-seconds: 120
        capabilities: [SPEECH_TO_TEXT]
      - id: dashscope-asr
        enabled: ${DASHSCOPE_ASR_ENABLED:false}
        provider: dashscope
        baseurl: ${DASHSCOPE_ASR_BASEURL:https://dashscope.aliyuncs.com/api/v1}
        apikey: ${DASHSCOPE_API_KEY:}
        model: ${DASHSCOPE_ASR_MODEL:paraformer-realtime-v2}
        timeout-seconds: 120
        capabilities: [SPEECH_TO_TEXT]
    tiers:
      chat-zh:
        display-name: Chat / Chinese
        description: General Chinese chat with ordered fallback
        strategy: FAIL_OVER
        members: [qwen, deepseek]
        capabilities: [CHAT, STREAMING_CHAT]
      analysis-zh:
        display-name: Analysis / Chinese
        description: Situation and memory analysis
        strategy: FAIL_OVER
        members: [qwen, deepseek]
        capabilities: [CHAT, STREAMING_CHAT]
      memory-zh:
        display-name: Memory / Chinese
        description: Memory extraction
        strategy: FAIL_OVER
        members: [qwen, deepseek]
        capabilities: [CHAT, STREAMING_CHAT]
      emotion-zh:
        display-name: Emotion / Chinese
        description: Emotion analysis with weighted routing
        strategy: WEIGHTED_RANDOM
        members: [qwen, deepseek]
        capabilities: [CHAT, STREAMING_CHAT]
      match-zh:
        display-name: Soul match / Chinese
        description: Match explanation and resonance analysis
        strategy: FAIL_OVER
        members: [qwen, deepseek]
        capabilities: [CHAT, STREAMING_CHAT]
      asr-default:
        display-name: Speech recognition
        description: OpenAI-compatible speech-to-text fallbacks
        strategy: FAIL_OVER
        members: [whisper-asr, dashscope-asr]
        capabilities: [SPEECH_TO_TEXT]
    routes:
      - id: zh-chat
        language: zh
        scene: chat
        risk-level: LOW
        primary-tier: chat-zh
        priority: 100
      - id: zh-situation-analysis
        language: zh
        scene: situation-analysis
        risk-level: LOW
        primary-tier: analysis-zh
        max-output-tokens: 256
        temperature: 0.1
        priority: 100
      - id: zh-emotion-analysis
        language: zh
        scene: emotion-analysis
        risk-level: LOW
        primary-tier: emotion-zh
        max-output-tokens: 32
        temperature: 0.3
        priority: 100
      - id: zh-memory-extract
        language: zh
        scene: memory-extract
        risk-level: LOW
        primary-tier: memory-zh
        priority: 100
      - id: zh-soul-match
        language: zh
        scene: soul-match
        risk-level: MEDIUM
        primary-tier: match-zh
        priority: 100
    groups:
      chat-zh:
        strategy: FAIL_OVER
        members: [qwen, deepseek]
      analysis-zh:
        strategy: FAIL_OVER
        members: [qwen, deepseek]
      memory-zh:
        strategy: FAIL_OVER
        members: [qwen, deepseek]
      emotion-zh:
        strategy: WEIGHTED_RANDOM
        members: [qwen, deepseek]
      match-zh:
        strategy: FAIL_OVER
        members: [qwen, deepseek]
      asr-default:
        strategy: FAIL_OVER
        members: [whisper-asr, dashscope-asr]
    matrix:
      zh:
        chat: 
          group: chat-zh
          temperature: 1.3
          maxTokens: 256
        situation-analysis: 
          group: analysis-zh
          temperature: 0.1
        emotion-analysis: 
          group: emotion-zh
          temperature: 0.3
          maxTokens: 32
        memory-extract: 
          group: memory-zh
        soul-match:
          group: match-zh

yusi:
  web:
    allowed-origin: ${YUSI_WEB_ALLOWED_ORIGIN:https://app.aseubel.cn}
    trusted-proxy-addresses: ${YUSI_TRUSTED_PROXY_ADDRESSES:}
  jwt:
    secret: ${YUSI_JWT_SECRET}
  security:
    crypto:
      server-aes-key-base64: ${YUSI_ENCRYPTION_KEY}
      backup-rsa-public-key-spki-base64: ${YUSI_BACKUP_RSA_PUBLIC_KEY_SPKI_BASE64}
      backup-rsa-private-key-pkcs8-base64: ${YUSI_BACKUP_RSA_PRIVATE_KEY_PKCS8_BASE64}
  memory:
    # 上下文记忆窗口大小（短期记忆的消息条数）
    context-window-size: 20
    # 中期记忆总结间隔（毫秒，默认 1 小时）
    mid-term-summary-interval: 7200000
    # 中期记忆触发扫描的 Cron 表达式（默认每 30 分钟执行一次）
    mid-term-scan-cron: "0 */10 * * * ?"
  oss:
    domain: ${OSS_DOMAIN:oss.aseubel.cn}
    region: ${OSS_REGION:cn-guangzhou}
    bucket-name: ${OSS_BUCKET_NAME:yangaseubel}
    endpoint: ${OSS_ENDPOINT:oss-cn-guangzhou.aliyuncs.com}
    url-expire-seconds: 3600
    max-file-size: 10485760
    image-folder: yusi/images/
    access-key-id: ${OSS_ACCESS_KEY_ID}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET}


# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 200
        keep-alive-seconds: 60
        block-queue-size: 500
        policy: CallerRunsPolicy

# 数据库配置；启动时配置数据库资源信息
spring:
  datasource:
    # ShardingSphere 对 Driver 自定义，实现分库分表等隐藏逻辑
    #    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    # ShardingSphere 配置文件路径
    #    url: jdbc:shardingsphere:classpath:shardingsphere-config.yaml
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD}
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/yusi?serverTimezone=UTC&characterEncoding=utf8&autoReconnect=true&serverTimezone=Asia/Shanghai}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: Retail_HikariCP
      minimum-idle: 10
      idle-timeout: 600000
      maximum-pool-size: 20
      auto-commit: true
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
    type: com.zaxxer.hikari.HikariDataSource
  servlet:
    multipart:
      max-file-size: 15MB #上传文件单个大小限制
      max-request-size: 60MB #上传文件总大小限制
      enabled: true #是否开启文件上传功能，默认false
  jpa:
    show-sql: false #是否打印SQL语句，默认false
    hibernate:
      ddl-auto: none #自动更新数据库表结构，默认none，可选值none、create、create-drop、validate、update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy #数据库表和字段的命名策略，默认org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect #数据库方言，默认org.hibernate.dialect.MySQL5Dialect

#Redis 配置
redis:
  sdk:
    config:
      host: ${REDIS_SDK_CONFIG_HOST:redis}
      port: ${REDIS_SDK_CONFIG_PORT:6379}
      password: ${REDIS_SDK_CONFIG_PASSWORD}
      pool-size: 10
      min-idle-size: 5
      idle-timeout: 30000
      connect-timeout: 5000
      retry-attempts: 3
      retry-interval: 1000
      ping-interval: 60000
      keep-alive: true

milvus:
  uri: ${MILVUS_URI}
  token: ${MILVUS_TOKEN}
  host: ${MILVUS_HOST:}
  port: ${MILVUS_PORT:19530}
  username: ${MILVUS_USERNAME}
  password: ${MILVUS_PASSWORD}

# 日志
logging:
  level:
    root: info
  config: classpath:logback-spring.xml

# MCP (Model Context Protocol) 配置
# 启用后，DiaryAssistant 将可以使用 MCP Server 提供的工具（如 web_search）
mcp:
  enabled: ${MCP_ENABLED:true} # Set false to disable the internal MCP client.
  server:
    url: http://yusi-mcp:11611/internal/mcp # Go MCP 内部端点 (仅部署工具)
    service-key: ${MCP_AUTH_API_KEY}

# 高德地图 API 配置
amap:
  key: ${AMAP_KEY}
  base-url: https://restapi.amap.com/v3

# 阿里云邮件推送服务
aliyun:
  dm:
    accessKeyId: ${ALIYUN_DM_ACCESS_KEY_ID}
    accessKeySecret: ${ALIYUN_DM_ACCESS_KEY_SECRET}
    accountName: ${ALIYUN_DM_ACCOUNT_NAME:yusi@mail.aseubel.cn}
    fromAlias: Yusi
    endpoint: dm.aliyuncs.com
